name: Verification

# Chaque envoi sur main rejoue toute la batterie de tests.
# Si un seul cours regresse, le deploiement est bloque.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Installer jsdom
        run: npm init -y >/dev/null && npm install jsdom --no-audit --no-fund

      - name: Le fichier se charge et contient tout
        run: node tests/ci_smoke.js

      - name: Rejouer chaque cours
        run: |
          for c in MRC BANQUE STYLE HUMOUR POKER DAMES YT RISK NIETZ; do
            echo "--- $c"
            CID=$c node --max-old-space-size=4000 tests/tall.js | tee /tmp/out.txt
            grep -q "^ERREURS: 0" /tmp/out.txt || { echo "REGRESSION sur $c"; exit 1; }
          done

      - name: Sauvegarde, synchro, interface, finitions
        run: |
          for t in tbackup tcloud tui tmissions tpratique tpro; do
            echo "--- $t"
            node --max-old-space-size=4000 tests/$t.js | tee /tmp/out.txt
            grep -q "^ERREURS: 0" /tmp/out.txt || { echo "ECHEC sur $t"; exit 1; }
          done

      - name: Aucune cle secrete dans le depot
        run: |
          if grep -rEq "sb_secret_|service_role|SUPABASE_SERVICE" index.html; then
            echo "Une cle secrete a ete trouvee dans index.html"
            exit 1
          fi
          echo "Aucune cle secrete"
